        .total-price { font-size: 1.6rem; font-weight: 700; color: #0a253b; }

        .badge { background: #eaf0f8; padding: 0.1rem 0.8rem; border-radius: 30px; font-size: 0.8rem; color: #1a3b5c; }

        .status-pending { background: #fff3cd; color: #856404; }

        .order-items { font-size: 0.9rem; color: #1a3b5c; margin: 0.4rem 0; }

        .member-stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; padding: 0.8rem 1.2rem; background: #f9fbfd; border-radius: 12px; border: 1px solid #eaeef3; }

        .status-bars { display: flex; gap: 0.4rem; height: 20px; border-radius: 12px; overflow: hidden; margin-top: 0.5rem; background: #eef2f7; }
        .status-bar { height: 100%; transition: width 0.5s ease; border-radius: 0; }
        .status-bar.pending { background: #d4a12a; }
        .status-bar.processing { background: #2a7de1; }
        .status-bar.shipped { background: #1e7a5e; }
        .status-bar.delivered { background: #28a745; }
        .status-bar.cancelled { background: #c53e3e; }
        .status-legend { display: flex; flex-wrap: wrap; gap: 0.8rem 1.5rem; margin: 0.6rem 0 0.2rem; font-size: 0.8rem; color: #1a3b5c; }
        .status-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

        .form-group input { width: 100%; padding: 0.6rem 0.9rem; border: 1.5px solid #dce5ef; border-radius: 12px; font-size: 0.95rem; background: #fafcff; }

<body>

<div class="app-wrapper">
    <!-- 導航 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-store"></i> 極簡邦購
            <span class="cloud-badge">☁️ 雲端版</span>
        </div>
        <div class="navbar-right">
            <!-- Line 好友按鈕 -->
            <button class="line-btn" onclick="copyLineID()">
                <i class="fab fa-line"></i> Line 好友
            </button>
            
            <div class="user-status">
                <div class="user-avatar" id="userAvatar">遊</div>
                <span class="user-name" id="userNameDisplay"><span class="guest-text">訪客</span></span>
                <span class="user-email" id="userEmailDisplay"></span>
                <span class="user-role-badge" id="userRoleBadge" style="display:none;"></span>
                <button class="btn-logout" id="logoutBtn" style="display:none;"><i class="fas fa-sign-out-alt"></i> 登出</button>
            </div>
            <button class="btn btn-outline btn-sm" id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登入</button>
            <button class="btn btn-primary btn-sm" id="registerBtn"><i class="fas fa-user-plus"></i> 註冊</button>
        </div>
    </nav>

    <!-- 頁籤 -->
    <div class="tabs" id="tabContainer">
        <button class="tab-btn active" data-tab="tabProducts"><i class="fas fa-store-alt"></i> 商品</button>

<script>
// ============================================================
//  Line ID 複製功能
// ============================================================
const LINE_ID = '@pangshopping';

function copyLineID() {
    navigator.clipboard.writeText(LINE_ID).then(() => {
        alert('✅ Line ID 已複製：' + LINE_ID);
    }).catch(() => {
        const input = document.createElement('input');
        input.value = LINE_ID;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('✅ Line ID 已複製：' + LINE_ID);
    });
}

// ============================================================
//  Firebase 設定
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyBGVu4WdwS5JoviLuuatMxavKb0XoEKPdw",
    authDomain: "shopping-cart-dfb10.firebaseapp.com",
    projectId: "shopping-cart-dfb10",
    storageBucket: "shopping-cart-dfb10.firebasestorage.app",
    messagingSenderId: "218409074648",
    appId: "1:218409074648:web:97951246bcab1ba36f3cad"
};

// 初始化 Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================================
//  全域變數
// ============================================================
let currentUser = null;
let currentUserData = null;
let cart = [];
let products = [];
let orders = [];

// ============================================================
//  預設商品
// ============================================================
const DEFAULT_PRODUCTS = [
    { id: 1, name: '經典後背包', price: 1280, desc: '耐用防潑水，大容量收納，適合通勤與旅行', image: 'https://picsum.photos/seed/bag/400/300' },
    { id: 2, name: '無線藍牙耳機', price: 890, desc: '主動降噪，續航24小時，舒適佩戴體驗', image: 'https://picsum.photos/seed/earphone/400/300' },
    { id: 3, name: '質感陶瓷杯', price: 420, desc: '手工製作，釉色溫潤，送禮自用兩相宜', image: 'https://picsum.photos/seed/cup/400/300' },
    { id: 4, name: 'LED 閱讀燈', price: 650, desc: '三段調光，護眼不閃爍，可彎曲設計', image: 'https://picsum.photos/seed/lamp/400/300' },
    { id: 5, name: '智慧手錶', price: 1990, desc: '心率監測、運動追蹤、防水50米', image: 'https://picsum.photos/seed/watch/400/300' },
    { id: 6, name: '無線充電盤', price: 750, desc: '快速充電，相容所有Qi設備，輕巧便攜', image: 'https://picsum.photos/seed/charger/400/300' },
];

// ============================================================
//  Firebase 操作函數
// ============================================================

async function initProducts() {
    try {
        const snapshot = await db.collection('products').get();
        if (snapshot.empty) {
            for (const p of DEFAULT_PRODUCTS) {
                await db.collection('products').doc(p.id.toString()).set(p);
            }
            console.log('✅ 預設商品已初始化');
        }
        await loadProducts();
    } catch (error) {
        console.error('初始化商品失敗:', error);
    }
}

async function loadProducts() {
    try {
        const snapshot = await db.collection('products').orderBy('id').get();
        products = [];
        snapshot.forEach(doc => {
            products.push({ id: parseInt(doc.id), ...doc.data() });
        });
        renderProducts();
        return products;
    } catch (error) {
        console.error('讀取商品失敗:', error);
        return [];
    }
}

async function addProduct(name, price, desc, image) {
    try {
        const maxId = products.reduce((max, p) => Math.max(max, p.id), 0);
        const newId = maxId + 1;
        const newProduct = {
            id: newId,
            name: name.trim(),
            price: parseInt(price),
            desc: desc || '精美商品，值得擁有',
            image: image || 'https://picsum.photos/seed/' + Date.now() + '/400/300'
        };
        await db.collection('products').doc(newId.toString()).set(newProduct);
        products.push(newProduct);
        renderProducts();
        return { success: true, product: newProduct };
    } catch (error) {
        console.error('新增商品失敗:', error);
        return { success: false, message: error.message };
    }
}

async function deleteProduct(productId) {
    try {
        await db.collection('products').doc(productId.toString()).delete();
        products = products.filter(p => p.id !== productId);
        renderProducts();
        cart = cart.filter(item => item.id !== productId);
        renderCart();
        if (currentUser) await saveCart(currentUser.uid);
        return { success: true };
    } catch (error) {
        console.error('刪除商品失敗:', error);
        return { success: false, message: error.message };
    }
}

async function loadUserData(uid) {
    try {
        const doc = await db.collection('users').doc(uid).get();
        if (doc.exists) {
            currentUserData = doc.data();
            return currentUserData;
        } else {
            const user = auth.currentUser;
            const newData = {
                name: user.displayName || user.email.split('@')[0],
                email: user.email,
                role: 'member',
                addresses: ['請新增您的收件地址或社區名稱'],
                createdAt: new Date().toISOString()
            };
            await db.collection('users').doc(uid).set(newData);
            currentUserData = newData;
            return newData;
        }
    } catch (error) {
        console.error('讀取會員資料失敗:', error);
        return null;
    }
}

async function updateUserData(uid, data) {
    try {
        await db.collection('users').doc(uid).update(data);
        if (currentUserData) {
            Object.assign(currentUserData, data);
        }
        return { success: true };
    } catch (error) {
        console.error('更新會員資料失敗:', error);
        return { success: false, message: error.message };
    }
}

async function loadCart(uid) {
    try {
        const doc = await db.collection('carts').doc(uid).get();
        if (doc.exists) {
            cart = doc.data().items || [];
        } else {
            cart = [];
            await db.collection('carts').doc(uid).set({ items: cart });
        }
        renderCart();
    } catch (error) {
        console.error('讀取購物車失敗:', error);
        cart = [];
        renderCart();
    }
}

async function saveCart(uid) {
    try {
        await db.collection('carts').doc(uid).set({ items: cart });
    } catch (error) {
        console.error('儲存購物車失敗:', error);
    }
}

async function createOrder(uid, userData, cartItems, address) {
    try {
        const existingOrders = await db.collection('orders')
            .where('userId', '==', uid)
            .get();
        const orderCount = existingOrders.size + 1;
        
        const orderId = userData.name + '-' + orderCount;
        
        const order = {
            id: orderId,
            userId: uid,
            userName: userData.name,
            userEmail: userData.email,
            items: cartItems.map(item => ({
                id: item.id,
                name: getProductById(item.id)?.name || '商品',
                price: getProductById(item.id)?.price || 0,
                quantity: item.quantity,
                image: getProductById(item.id)?.image || ''
            })),
            total: cartItems.reduce((s, i) => s + (getProductById(i.id)?.price || 0) * i.quantity, 0),
            status: 'pending',
            address: address || userData.addresses?.[0] || '未填寫',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
        
        await db.collection('orders').doc(orderId).set(order);
        console.log('✅ 訂單已建立，訂單編號:', orderId);
        return { success: true, orderId: orderId, order: order };
    } catch (error) {
        console.error('建立訂單失敗:', error);
        return { success: false, message: error.message };
    }
}

async function loadOrders(uid) {
    try {
        console.log('🔍 讀取訂單，使用者 UID:', uid);
        
        if (!uid) {
            console.warn('⚠️ 沒有 UID，無法讀取訂單');
            orders = [];
            renderOrders();
            return;
        }

        let query = db.collection('orders').orderBy('createdAt', 'desc');
        
        if (currentUserData?.role !== 'admin') {
            query = query.where('userId', '==', uid);
            console.log('🔍 一般會員：只查自己的訂單 (userId =', uid, ')');
        } else {
            console.log('🔍 管理員：查詢所有訂單');
        }
        
        const snapshot = await query.get();
        orders = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            orders.push({ id: doc.id, ...data });
            console.log('📦 訂單:', doc.id, 'userId:', data.userId);
        });
        console.log('✅ 共讀取', orders.length, '筆訂單');
        renderOrders();
    } catch (error) {
        console.error('讀取訂單失敗:', error);
        orders = [];
        renderOrders();
    }
}

async function updateOrderStatus(orderId, status) {
    try {
        await db.collection('orders').doc(orderId).update({
            status: status,
            updatedAt: new Date().toISOString()
        });
        const order = orders.find(o => o.id === orderId);
        if (order) {
            order.status = status;
            order.updatedAt = new Date().toISOString();
        }
        renderOrders();
        return { success: true };
    } catch (error) {
        console.error('更新訂單失敗:', error);
        return { success: false, message: error.message };
    }
}

async function loadAllUsers() {
    try {
        const snapshot = await db.collection('users').get();
        const users = [];
        snapshot.forEach(doc => {
            users.push({ id: doc.id, ...doc.data() });
        });
        return users;
    } catch (error) {
        console.error('讀取會員列表失敗:', error);
        return [];
    }
}

async function deleteUser(uid) {
    try {
        const ordersSnapshot = await db.collection('orders').where('userId', '==', uid).get();
        const batch = db.batch();
        ordersSnapshot.forEach(doc => {
            batch.delete(doc.ref);
        });
        await batch.commit();
        console.log('✅ 已刪除該會員的所有訂單');
        
        await db.collection('carts').doc(uid).delete();
        console.log('✅ 已刪除該會員的購物車');
        
        await db.collection('users').doc(uid).delete();
        console.log('✅ 已刪除該會員的資料');
        
        console.log('✅ 會員、購物車、訂單已全部刪除（訂單不保留）');
        return { success: true };
    } catch (error) {
        console.error('刪除會員失敗:', error);
        return { success: false, message: error.message };
    }
}

// ============================================================
//  輔助函數
// ============================================================
function getProductById(id) {
    return products.find(p => p.id === id);
}

function getActiveCart() {
    return cart.filter(item => item.quantity > 0);
}

function calcTotal() {
    return getActiveCart().reduce((s, i) => s + (getProductById(i.id)?.price || 0) * i.quantity, 0);
}

function calcTotalItems() {
    return getActiveCart().reduce((s, i) => s + i.quantity, 0);
}

// ============================================================
//  渲染函數
// ============================================================

function renderProducts() {
    const grid = document.getElementById('productGrid');
    const isAdmin = currentUserData?.role === 'admin';

    if (!products || products.length === 0) {
        grid.innerHTML = `<div class="empty-cart"><i class="fas fa-spinner fa-spin"></i><p>載入商品中...</p></div>`;
        return;
    }

    let html = '';
    products.forEach(p => {
        const imgHtml = p.image 
            ? `<img class="product-image" src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />`
            : '';
        const placeholderHtml = p.image ? '' : `<div class="product-image-placeholder"><i class="fa-solid fa-box"></i></div>`;
        
        html += `
            <div class="product-card" data-id="${p.id}">
                ${isAdmin ? `<button class="delete-btn" data-id="${p.id}" title="刪除商品"><i class="fas fa-times"></i></button>` : ''}
                ${imgHtml}
                ${placeholderHtml}
                <div class="name">${p.name}</div>
                ${p.desc ? `<div class="desc">${p.desc}</div>` : ''}
                <div class="price">$ ${p.price}</div>
                <button class="btn btn-primary btn-sm add-to-cart" data-id="${p.id}">
                    <i class="fas fa-cart-plus"></i> 加入購物車
                </button>
            </div>
        `;
    });
    grid.innerHTML = html;

    document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', async function() {
            if (!currentUser) {
                alert('⚠️ 請先登入才能加入購物車！');
                openModal('login');
                return;
            }
            const id = parseInt(this.dataset.id);
            await addToCart(id);
        });
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            if (confirm('確定要刪除此商品嗎？')) {
                await deleteProduct(id);
            }
        });
    });
}

async function addToCart(productId) {
    let item = cart.find(i => i.id === productId);
    if (item) {
        item.quantity += 1;
    } else {
        cart.push({ id: productId, quantity: 1 });
    }
    renderCart();
    document.getElementById('cartBadge').textContent = calcTotalItems();
    if (currentUser) {
        await saveCart(currentUser.uid);
    }
}

function renderCart() {
    const container = document.getElementById('cartItemsContainer');
    const activeItems = getActiveCart();
    document.getElementById('cartBadge').textContent = calcTotalItems();

    if (activeItems.length === 0) {
        container.innerHTML = `<div class="empty-cart"><i class="fas fa-box-open"></i><p>購物車是空的</p></div>`;
        document.getElementById('totalPriceDisplay').innerHTML = `<small>$</small>0`;
        return;
    }

    let html = '';
    activeItems.forEach(item => {
        const p = getProductById(item.id);
        if (!p) return;
        const subtotal = p.price * item.quantity;
        html += `

document.getElementById('cartItemsContainer').addEventListener('click', async function(e) {
    const target = e.target.closest('button');
    if (!target) return;
    const action = target.dataset.action;
    const id = parseInt(target.dataset.id, 10);
    if (isNaN(id)) return;

    if (action === 'increase') {
        let item = cart.find(i => i.id === id);
        if (item) item.quantity += 1;
        renderCart();
        if (currentUser) await saveCart(currentUser.uid);
    } else if (action === 'decrease') {
        let item = cart.find(i => i.id === id);
        if (item) {
            item.quantity -= 1;
            if (item.quantity < 0) item.quantity = 0;
        }
        renderCart();
        if (currentUser) await saveCart(currentUser.uid);
    } else if (action === 'remove') {
        let item = cart.find(i => i.id === id);
        if (item) item.quantity = 0;
        renderCart();
        if (currentUser) await saveCart(currentUser.uid);
    }
    document.getElementById('cartBadge').textContent = calcTotalItems();
});

document.getElementById('clearCartBtn').addEventListener('click', async function() {
    if (calcTotalItems() === 0) return;
    if (confirm('確定要清空購物車嗎？')) {
        cart.forEach(item => { item.quantity = 0; });
        renderCart();
        document.getElementById('cartBadge').textContent = 0;
        if (currentUser) await saveCart(currentUser.uid);
    }
});

document.getElementById('checkoutBtn').addEventListener('click', async function() {

        alert('⚠️ 請先登入才能結帳！');

        return;
    }

    const activeItems = getActiveCart();

function renderOrders() {
    const container = document.getElementById('orderList');
    
    if (!currentUser) {
        container.innerHTML = `<div class="empty-cart"><i class="fas fa-lock"></i><p>請先登入查看您的訂單</p></div>`;
        return;
    }

    let displayOrders = orders;
    if (currentUserData?.role !== 'admin') {
        displayOrders = orders.filter(o => o.userId === currentUser.uid);
        console.log('🔍 過濾後訂單數量:', displayOrders.length);
    }

    if (displayOrders.length === 0) {
        container.innerHTML = `<div class="empty-cart"><i class="fas fa-box"></i><p>${currentUserData?.role === 'admin' ? '目前沒有任何訂單' : '您目前尚無訂單'}</p></div>`;
        return;
    }

    const statusMap = {
        'pending': '待處理',
        'processing': '處理中',
        'shipped': '已出貨',
        'delivered': '已送達',
        'cancelled': '已取消'
    };
    const statusClass = {
        'pending': 'status-pending',
        'processing': 'status-processing',
        'shipped': 'status-shipped',
        'delivered': 'status-delivered',
        'cancelled': 'status-cancelled'
    };

    let html = '';
    displayOrders.forEach(order => {
        const itemsStr = order.items.map(i => `${i.name} x${i.quantity}`).join('、');
        const statusText = statusMap[order.status] || order.status;
        const isAdmin = currentUserData?.role === 'admin';
        
        html += `
            <div class="order-card">
                <div class="order-header">
                    <span class="order-id" style="font-weight:700;color:#1a4d7a;">${order.id}</span>
                    <span class="order-date">${new Date(order.createdAt).toLocaleString('zh-TW')}</span>
                    <span class="order-status ${statusClass[order.status] || 'status-pending'}">${statusText}</span>
                </div>
                ${isAdmin ? `<div class="order-user-info">👤 ${order.userName} (📧${order.userEmail})</div>` : ''}
                <div class="order-items">📦 ${itemsStr}</div>
                <div class="order-address">📍 ${order.address}</div>
                <div class="order-total">總計：$ ${order.total}</div>
                <div class="order-actions">
                    ${isAdmin ? `
                        ${order.status === 'pending' ? `<button class="btn btn-warning btn-xs status-update" data-id="${order.id}" data-status="processing">改為處理中</button>` : ''}
                        ${order.status === 'processing' ? `<button class="btn btn-primary btn-xs status-update" data-id="${order.id}" data-status="shipped">改為已出貨</button>` : ''}
                        ${order.status === 'shipped' ? `<button class="btn btn-success btn-xs status-update" data-id="${order.id}" data-status="delivered">改為已送達</button>` : ''}
                        ${['pending', 'processing'].includes(order.status) ? `<button class="btn btn-danger btn-xs delete-order-btn" data-id="${order.id}">🗑️ 刪除訂單</button>` : ''}
                    ` : `
                        <span style="font-size:0.8rem;color:#5f7c9a;">🔒 訂單狀態由管理員更新</span>
                    `}
                </div>
            </div>
        `;
    });
    container.innerHTML = html;

    document.querySelectorAll('.status-update').forEach(btn => {
        btn.addEventListener('click', async function() {
            const orderId = this.dataset.id;
            const status = this.dataset.status;
            const result = await updateOrderStatus(orderId, status);
            if (result.success) {
                alert(`✅ 訂單狀態已更新為「${statusMap[status] || status}」`);
                await loadOrders(currentUser.uid);
                await renderStats();
                await renderMemberManagement();
            } else {
                alert('⚠️ ' + result.message);
            }
        });
    });

    document.querySelectorAll('.delete-order-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const orderId = this.dataset.id;
            if (!confirm(`確定要刪除此訂單（${orderId}）嗎？\n此操作無法復原！`)) return;
            
            try {
                await db.collection('orders').doc(orderId).delete();
                alert(`✅ 訂單 ${orderId} 已刪除`);
                await loadOrders(currentUser.uid);
                await renderStats();
                await renderMemberManagement();
            } catch (error) {
                console.error('刪除訂單失敗:', error);
                alert('⚠️ 刪除訂單失敗：' + error.message);
            }
        });
    });
}

async function renderMemberManagement() {
    const isAdmin = currentUserData?.role === 'admin';
    if (!currentUser || !isAdmin) {
        document.getElementById('memberManagement').style.display = 'none';
        document.getElementById('memberEmpty').style.display = 'block';
        return;
    }

    document.getElementById('memberManagement').style.display = 'block';
    document.getElementById('memberEmpty').style.display = 'none';

    const users = await loadAllUsers();
    const nonAdminUsers = users.filter(u => u.role !== 'admin');

    const allOrdersSnapshot = await db.collection('orders').get();
    const userStats = {};
    let totalOrders = 0;
    let totalSpending = 0;
    
    allOrdersSnapshot.forEach(doc => {
        const data = doc.data();
        const uid = data.userId;
        if (!userStats[uid]) {
            userStats[uid] = { count: 0, total: 0 };
        }
        userStats[uid].count += 1;
        userStats[uid].total += data.total || 0;
        if (nonAdminUsers.find(u => u.id === uid)) {
            totalOrders += 1;
            totalSpending += data.total || 0;
        }
    });

    document.getElementById('totalMembers').textContent = nonAdminUsers.length;
    document.getElementById('totalMemberOrders').textContent = totalOrders;
    document.getElementById('totalMemberSpending').textContent = '$' + totalSpending;

    let html = '';
    if (nonAdminUsers.length === 0) {
        html = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:#5f7c9a;">尚無會員</td></tr>`;
    } else {
        nonAdminUsers.forEach(u => {
            const stats = userStats[u.id] || { count: 0, total: 0 };
            html += `
                <tr>
                    <td><strong>${u.name}</strong></td>
                    <td>${u.email}</td>
                    <td><span class="member-role member">會員</span></td>
                    <td><span class="order-count">${stats.count} 筆</span></td>
                    <td>$${stats.total}</td>
                    <td>
                        <button class="view-orders-btn" data-userid="${u.id}" title="查看訂單"><i class="fas fa-eye"></i></button>
                        <button class="delete-member-btn" data-userid="${u.id}" title="刪除會員"><i class="fas fa-user-minus"></i></button>
                    </td>
                </tr>
            `;
        });
    }
    document.getElementById('memberTableBody').innerHTML = html;

    document.querySelectorAll('.view-orders-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const userId = this.dataset.userid;
            const member = nonAdminUsers.find(u => u.id === userId);
            if (member) {
                const userOrders = orders.filter(o => o.userId === userId);
                if (userOrders.length === 0) {
                    alert(`📋 ${member.name} 目前尚無訂單`);
                } else {
                    let msg = `📋 ${member.name} 的訂單 (${userOrders.length} 筆)：\n\n`;
                    const statusMap = {
                        'pending': '待處理', 'processing': '處理中',
                        'shipped': '已出貨', 'delivered': '已送達',
                        'cancelled': '已取消'
                    };
                    userOrders.forEach(o => {
                        const itemsStr = o.items.map(i => `${i.name} x${i.quantity}`).join('、');
                        msg += `  ${o.id} | ${statusMap[o.status] || o.status} | $${o.total} | ${itemsStr}\n`;
                    });
                    alert(msg);
                }
            }
        });
    });

    document.querySelectorAll('.delete-member-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            const userId = this.dataset.userid;
            const member = nonAdminUsers.find(u => u.id === userId);
            if (!member) return;
            
            if (!confirm(`確定要刪除會員「${member.name}」嗎？\n刪除後該會員的所有訂單也將一併刪除！`)) return;
            
            const result = await deleteUser(userId);
            if (result.success) {
                alert(`✅ 會員「${member.name}」及其所有訂單已刪除`);
                await renderMemberManagement();
                await renderStats();
            } else {
                alert('⚠️ ' + result.message);
            }
        });
    });
}

async function renderStats() {
    const isAdmin = currentUserData?.role === 'admin';
    if (!currentUser || !isAdmin) {
        document.getElementById('statsContent').style.display = 'none';
        document.getElementById('statsEmpty').style.display = 'block';
        return;
    }

    document.getElementById('statsContent').style.display = 'block';
    document.getElementById('statsEmpty').style.display = 'none';

    const snapshot = await db.collection('orders').get();
    const allOrders = [];
    snapshot.forEach(doc => {
        allOrders.push({ id: doc.id, ...doc.data() });
    });

    const total = allOrders.length;
    const pending = allOrders.filter(o => o.status === 'pending').length;
    const processing = allOrders.filter(o => o.status === 'processing').length;
    const shipped = allOrders.filter(o => o.status === 'shipped').length;
    const delivered = allOrders.filter(o => o.status === 'delivered').length;
    const cancelled = allOrders.filter(o => o.status === 'cancelled').length;
    const completed = shipped + delivered;
    const totalAmount = allOrders.reduce((sum, o) => sum + (o.total || 0), 0);

    document.getElementById('statTotalOrders').textContent = total;
    document.getElementById('statPending').textContent = pending + processing;
    document.getElementById('statCompleted').textContent = completed;
    document.getElementById('statCancelled').textContent = cancelled;
    document.getElementById('statTotalAmount').textContent = '$' + totalAmount;

    const maxVal = Math.max(total, 1);
    document.getElementById('statusBars').innerHTML = `
        <div class="status-bar pending" style="width:${(pending/maxVal)*100}%;"></div>
        <div class="status-bar processing" style="width:${(processing/maxVal)*100}%;"></div>
        <div class="status-bar shipped" style="width:${(shipped/maxVal)*100}%;"></div>
        <div class="status-bar delivered" style="width:${(delivered/maxVal)*100}%;"></div>
        <div class="status-bar cancelled" style="width:${(cancelled/maxVal)*100}%;"></div>
    `;

    document.getElementById('statusLegend').innerHTML = `
        <span><span class="dot" style="background:#d4a12a;"></span>待處理 ${pending}</span>
        <span><span class="dot" style="background:#2a7de1;"></span>處理中 ${processing}</span>
        <span><span class="dot" style="background:#1e7a5e;"></span>已出貨 ${shipped}</span>
        <span><span class="dot" style="background:#28a745;"></span>已送達 ${delivered}</span>
        <span><span class="dot" style="background:#c53e3e;"></span>已取消 ${cancelled}</span>
    `;

    const recentOrders = allOrders.slice(0, 10);
    const statusMap = {
        'pending': '待處理', 'processing': '處理中', 'shipped': '已出貨',
        'delivered': '已送達', 'cancelled': '已取消'
    };
    const statusClass = {
        'pending': 'status-pending', 'processing': 'status-processing',
        'shipped': 'status-shipped', 'delivered': 'status-delivered',
        'cancelled': 'status-cancelled'
    };
    
    if (recentOrders.length === 0) {
        document.getElementById('recentOrdersList').innerHTML = `<p style="color:#5f7c9a;text-align:center;padding:1rem;">尚無訂單</p>`;
    } else {
        let html = '';
        recentOrders.forEach(order => {
            const itemsStr = order.items.map(i => `${i.name} x${i.quantity}`).join('、');
            html += `
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid #eaeef3;font-size:0.9rem;gap:0.3rem;">
                    <span style="font-weight:500;color:#0b1e2e;">${order.id}</span>
                    <span style="color:#5f7c9a;font-size:0.8rem;">${itemsStr}</span>
                    <span style="font-weight:600;color:#1a4d7a;">$${order.total}</span>
                    <span class="order-status ${statusClass[order.status] || 'status-pending'}" style="font-size:0.7rem;">${statusMap[order.status] || order.status}</span>
                </div>
            `;
        });
        document.getElementById('recentOrdersList').innerHTML = html;
    }
}

document.getElementById('saveProfileBtn').addEventListener('click', async function() {
    if (!currentUser) {
        alert('請先登入！');
        return;
    }

    const name = document.getElementById('editName').value.trim();
    const password = document.getElementById('editPassword').value.trim();
    const passwordConfirm = document.getElementById('editPasswordConfirm').value.trim();

    if (!name) {
        document.getElementById('editProfileMessage').textContent = '請輸入姓名！';
        document.getElementById('editProfileMessage').style.color = '#c53e3e';
        document.getElementById('editProfileMessage').style.display = 'block';
        return;
    }

    if (password && password.length < 6) {
        document.getElementById('editProfileMessage').textContent = '密碼至少 6 個字元！';
        document.getElementById('editProfileMessage').style.color = '#c53e3e';
        document.getElementById('editProfileMessage').style.display = 'block';
        return;
    }

    if (password && password !== passwordConfirm) {
        document.getElementById('editProfileMessage').textContent = '兩次輸入的密碼不一致！';
        document.getElementById('editProfileMessage').style.color = '#c53e3e';
        document.getElementById('editProfileMessage').style.display = 'block';
        return;
    }

    const result = await updateUserData(currentUser.uid, { name: name });
    if (result.success) {
        if (password) {
            try {
                await auth.currentUser.updatePassword(password);
                document.getElementById('editProfileMessage').textContent = '✅ 個人資料已更新（含密碼）！';
            } catch (error) {
                document.getElementById('editProfileMessage').textContent = '⚠️ 姓名已更新，但密碼更新失敗：' + error.message;
                document.getElementById('editProfileMessage').style.color = '#c53e3e';
                document.getElementById('editProfileMessage').style.display = 'block';
                return;
            }
        } else {
            document.getElementById('editProfileMessage').textContent = '✅ 個人資料已更新！';
        }
        document.getElementById('editProfileMessage').style.color = '#1e7a5e';
        document.getElementById('editProfileMessage').style.display = 'block';
        document.getElementById('editPassword').value = '';
        document.getElementById('editPasswordConfirm').value = '';
        await updateUserUI();
        await renderProfile();
    } else {
        document.getElementById('editProfileMessage').textContent = '⚠️ ' + result.message;
        document.getElementById('editProfileMessage').style.color = '#c53e3e';
        document.getElementById('editProfileMessage').style.display = 'block';
    }
});

function bindAddProductButton() {

    if (!addBtn) return;
    
    addBtn.removeEventListener('click', handleAddProduct);
    addBtn.addEventListener('click', handleAddProduct);
    console.log('✅ 新增商品按鈕已綁定');
}

async function handleAddProduct() {
    const name = document.getElementById('newProductName').value.trim();
    const price = document.getElementById('newProductPrice').value.trim();
    const desc = document.getElementById('newProductDesc').value.trim();
    const image = document.getElementById('newProductImage').value.trim();

    if (!name) {
        alert('請輸入商品名稱！');
        document.getElementById('newProductName').focus();
        return;
    }
    if (!price || isNaN(price) || parseInt(price) <= 0) {
        alert('請輸入有效的價格！');
        document.getElementById('newProductPrice').focus();
        return;
    }

    const result = await addProduct(name, parseInt(price), desc, image);
    if (result.success) {
        document.getElementById('newProductName').value = '';
        document.getElementById('newProductPrice').value = '';
        document.getElementById('newProductDesc').value = '';
        document.getElementById('newProductImage').value = '';
        alert('✅ 商品已新增！');
        renderProducts();
    } else {
        alert('❌ ' + result.message);
    }
}

// ============================================================
//  認證管理
// ============================================================

auth.onAuthStateChanged(async function(user) {
    console.log('🔐 認證狀態變更:', user ? '已登入 - ' + user.uid : '未登入');
    
    if (user) {
        currentUser = user;
        currentUserData = await loadUserData(user.uid);
        console.log('👤 會員資料:', currentUserData);
        
        await loadCart(user.uid);
        await loadOrders(user.uid);
        
        if (products.length === 0) {
            await loadProducts();
        }
        
        await updateUserUI();
        await renderProducts();
        await renderStats();
        await renderMemberManagement();
        await renderProfile();
        
        bindAddProductButton();
    } else {
        currentUser = null;
        currentUserData = null;
        cart = [];
        orders = [];
        
        if (products.length === 0) {
            await loadProducts();
        }
        
        await updateUserUI();
        renderCart();
        renderOrders();
        renderStats();
        renderMemberManagement();
        renderProfile();
    }
});

async function updateUserUI() {
    if (currentUser && currentUserData) {
        const initial = currentUserData.name ? currentUserData.name.charAt(0).toUpperCase() : 'U';
        document.getElementById('userAvatar').textContent = initial;
        document.getElementById('userNameDisplay').innerHTML = `<strong>${currentUserData.name}</strong>`;
        document.getElementById('userEmailDisplay').textContent = `📧 ${currentUserData.email}`;
        document.getElementById('userEmailDisplay').style.display = 'inline';
        
        if (currentUserData.role === 'admin') {
            document.getElementById('userRoleBadge').textContent = '👑 管理員';
            document.getElementById('userRoleBadge').className = 'user-role-badge admin';
            document.getElementById('userRoleBadge').style.display = 'inline';
        } else {
            document.getElementById('userRoleBadge').textContent = '會員';
            document.getElementById('userRoleBadge').className = 'user-role-badge';
            document.getElementById('userRoleBadge').style.display = 'inline';
        }
        
        document.getElementById('logoutBtn').style.display = 'inline-block';
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('registerBtn').style.display = 'none';
    } else {
        document.getElementById('userAvatar').textContent = '遊';
        document.getElementById('userNameDisplay').innerHTML = `<span class="guest-text">訪客</span>`;
        document.getElementById('userEmailDisplay').textContent = '';
        document.getElementById('userEmailDisplay').style.display = 'none';
        document.getElementById('userRoleBadge').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'inline-flex';
        document.getElementById('registerBtn').style.display = 'inline-flex';
    }
    updateTabs();
    document.getElementById('cartBadge').textContent = calcTotalItems();
}

function updateTabs() {
    const isLoggedIn = !!currentUser;
    const isAdmin = currentUserData?.role === 'admin';

    document.querySelectorAll('.tab-btn').forEach(btn => {
        const tab = btn.dataset.tab;
        if (tab === 'tabProducts') {
            btn.classList.remove('hidden');
        } else if (tab === 'tabMembers' || tab === 'tabStats') {
            if (isAdmin) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        } else {
            if (isLoggedIn) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }
    });

    if (!isLoggedIn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-tab="tabProducts"]')?.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tabProducts')?.classList.add('active');
    }

    document.getElementById('adminProductForm').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('editProfileContainer').style.display = isLoggedIn ? 'block' : 'none';
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', async function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        const target = document.getElementById(this.dataset.tab);
        if (target) target.classList.add('active');
        if (this.dataset.tab === 'tabOrders' && currentUser) {
            await loadOrders(currentUser.uid);
        }
        if (this.dataset.tab === 'tabMembers') await renderMemberManagement();
        if (this.dataset.tab === 'tabStats') await renderStats();
        if (this.dataset.tab === 'tabProfile') await renderProfile();
    });
});

// ============================================================
//  模態框（登入/註冊）
// ============================================================
function openModal(mode) {
    renderModalContent(mode);
    document.getElementById('authModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('authModal').classList.remove('active');
    document.body.style.overflow = '';
}

document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('authModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

function renderModalContent(mode) {
    const content = document.getElementById('modalContent');
    if (mode === 'login') {
        content.innerHTML = `
            <h2 class="modal-title"><i class="fas fa-sign-in-alt" style="color:#2a7de1;"></i> 登入</h2>
            <p class="modal-subtitle">歡迎回來！請輸入您的 Email 和密碼</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="請輸入您的 Email" required />
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" id="loginPassword" placeholder="輸入密碼" required />
                </div>
                <div class="form-error" id="loginError"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.8rem;">
                    <i class="fas fa-sign-in-alt"></i> 登入
                </button>
            </form>
            <div class="modal-footer-text">
                還沒有帳號？ <a id="switchToRegister">立即註冊</a>
            </div>
            <div class="modal-footer-text" style="margin-top:0.5rem;font-size:0.8rem;color:#8aa3bf;">
                管理員帳號請在 Firebase Authentication 手動建立
            </div>
        `;
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('switchToRegister').addEventListener('click', function() {
            renderModalContent('register');
        });
    } else {
        content.innerHTML = `
            <h2 class="modal-title"><i class="fas fa-user-plus" style="color:#1e7a5e;"></i> 註冊</h2>
            <p class="modal-subtitle">建立帳號，開始購物！</p>
            <form id="registerForm">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="regName" placeholder="請輸入您的姓名" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="請輸入您的 Email（作為登入帳號）" required />
                </div>
                <div class="form-group">
                    <label>密碼</label>
                    <input type="password" id="regPassword" placeholder="至少 6 個字元" required minlength="6" />
                </div>
                <div class="form-error" id="registerError"></div>
                <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:0.8rem;">
                    <i class="fas fa-user-plus"></i> 註冊
                </button>
            </form>
            <div class="modal-footer-text">
                已有帳號？ <a id="switchToLogin">返回登入</a>
            </div>
        `;
        document.getElementById('registerForm').addEventListener('submit', handleRegister);
        document.getElementById('switchToLogin').addEventListener('click', function() {
            renderModalContent('login');
        });
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');

    if (!email || !password) {
        errorEl.textContent = '請填寫完整資料';
        errorEl.classList.add('show');
        return;
    }

    try {
        await auth.signInWithEmailAndPassword(email, password);
        errorEl.classList.remove('show');
        closeModal();
    } catch (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add('show');
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    const errorEl = document.getElementById('registerError');

    if (!name || !email || !password) {
        errorEl.textContent = '請填寫完整資料';
        errorEl.classList.add('show');
        return;
    }
    if (password.length < 6) {
        errorEl.textContent = '密碼至少 6 個字元';
        errorEl.classList.add('show');
        return;
    }

    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(userCredential.user.uid).set({
            name: name,
            email: email,
            role: 'member',
            addresses: ['請新增您的收件地址或社區名稱'],
            createdAt: new Date().toISOString()
        });
        errorEl.classList.remove('show');
        closeModal();
        alert(`🎉 註冊成功！歡迎 ${name}！`);
    } catch (error) {
        errorEl.textContent = error.message;
        errorEl.classList.add('show');
    }
}

document.getElementById('logoutBtn').addEventListener('click', function() {
    if (confirm('確定要登出嗎？')) {
        auth.signOut();
    }
});

document.getElementById('loginBtn').addEventListener('click', function() { openModal('login'); });
document.getElementById('registerBtn').addEventListener('click', function() { openModal('register'); });

    console.log('🚀 極簡邦購初始化...');
    await loadProducts();
    renderCart();
    document.getElementById('cartBadge').textContent = calcTotalItems();
    bindAddProductButton();
    console.log('✅ 初始化完成');
}
